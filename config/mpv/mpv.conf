# crt-tv mpv defaults (deployed to ~/.config/mpv/mpv.conf)

# --- Output (headless CRT via DRM) ---
vo=drm
# audio uses the system default (raspi-config -> Audio -> HDMI)

# --- Sizing on the 4:3 Trinitron ---
# Output is forced to a 4:3 mode (see cmdline.txt), so keep aspect and don't zoom.
# The app toggles panscan=1.0 live for zoom-to-fill.
keepaspect=yes
panscan=0.0

# --- Subtitles: large, raised off the bottom edge (CRT overscan-safe) ---
sub-font-size=40
sub-scale=1.0
sub-pos=90
sub-bold=yes
sub-color="#FFFFFFFF"
sub-border-color="#FF000000"
sub-border-size=3.2
sub-shadow-offset=1
sub-shadow-color="#80000000"

# --- Language preference fallback (autotracks.lua does the fine-grained rules) ---
alang=spa,lat,es,jpn,eng
slang=spa,es,eng

# --- Behaviour ---
save-position-on-quit=no
osd-level=0
force-window=no
